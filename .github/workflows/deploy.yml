name: Deploy
on:
  push:
    branches:
      - main

env:
  AWS_ACCOUNT_ID: '466565666523'
  STATIC_BUCKET: luhn.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{env.AWS_ACCOUNT_ID}}:role/luhn.com-github-actions-role
          role-duration-seconds: 900
          aws-region: us-west-2

      - name: Upload assets
        run: |
          aws s3 cp --recursive src/ s3://$STATIC_BUCKET/
